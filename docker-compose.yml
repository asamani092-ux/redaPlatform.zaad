services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ridaa
      POSTGRES_PASSWORD: ridaa
      POSTGRES_DB: ridaa
    ports:
      - "5432:5432"
    volumes:
      - ridaa_pg:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgresql://ridaa:ridaa@db:5432/ridaa?schema=public
      AUTH_SECRET: change-me-in-production
      AUTH_TRUST_HOST: "true"
      # للوصول المحلي فقط؛ على نطاق عام عيّن AUTH_URL لرابط الموقع أو احذفه
      NEXTAUTH_URL: http://localhost:3100
      PORT: "3100"
      IDLE_TIMEOUT_MS: "3600000"
      ADMIN_MOBILE: "0500000000"
      ADMIN_PASSWORD: "Admin@1234"
      WHATSAPP_PROVIDER: stub

volumes:
  ridaa_pg:
